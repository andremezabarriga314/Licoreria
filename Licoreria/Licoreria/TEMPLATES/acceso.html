<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Libido & Tentación</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #100d0d;
            color: #f8eee7;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .login {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #1b1515;
            border: 1px solid #49302b;
            border-radius: 18px;
            box-shadow: 0 25px 80px #0009;
        }
        h1 {
            color: #d6a46c;
            text-align: center;
            font-family: Georgia, serif;
            font-size: 29px;
        }
        .subtitle {
            text-align: center;
            color: #a99487;
            margin-bottom: 32px;
        }
        h2 { font-size: 21px; }
        label {
            display: block;
            margin: 20px 0 9px;
            color: #d9c8bc;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #493832;
            background: #120f0f;
            color: white;
            outline: none;
        }
        input:focus { border-color: #c18b56; }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 27px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(110deg, #a86e3d, #dfb17c);
            color: #1b1110;
            font-weight: bold;
            cursor: pointer;
        }
        .messages {
            margin-top: 20px;
            color: #ffaaa0;
            font-size: 13px;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #b9a295;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>Libido & Tentación</h1>
        <p class="subtitle">ACCESO ADMINISTRATIVO</p>

        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para continuar.</p>

        <form method="POST" action="{% url 'role_login' %}">
            {% csrf_token %}
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text"
                   placeholder="Ingresa tu usuario" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password"
                   placeholder="Ingresa tu contraseña" required>

            <button type="submit">Iniciar sesión</button>
        </form>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <a href="{% url 'home' %}">Volver a la tienda</a>
    </main>
</body>
</html>
